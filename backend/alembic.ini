# Alembic Configuration for University ERP

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
# Format: YYYYMMDD_HHMM_<rev>_<slug> for clean chronologically sorted migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Sys.path prepend so app modules are discovered
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions
sourceless = false

# Version location
version_locations = %(here)s/migrations/versions

# Path separator
path_separator = os

# Dynamic URL: loaded from app.core.config.settings in env.py
# Fallback placeholder below is overridden by env.py
sqlalchemy.url = postgresql+asyncpg://erp_app:erp_secure_password_123@localhost:5434/university_erp

[post_write_hooks]
# Post-write formatting hook (e.g., ruff or black) can be enabled if desired

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
